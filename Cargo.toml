[package]
name = "discord-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Interact with Discord from the command line — send and read messages, list servers and channels. Bot-token auth, Keychain-secured, agent-friendly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/discord-cli"
homepage = "https://github.com/piekstra/discord-cli"
readme = "README.md"
keywords = ["discord", "chat", "bot", "messaging", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "discord"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.1.2" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
